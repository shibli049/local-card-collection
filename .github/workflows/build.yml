name: Build executables
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go run ./cmd/build
      - uses: actions/upload-artifact@v4
        with:
          name: SoftInventory-all-platforms
          path: dist/*.zip
